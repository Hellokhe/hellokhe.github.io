title: ZenOS Wiki
description: Bare-metal OS with userspace and X11
remote_theme: just-the-docs/just-the-docs

url: https://hellokhe.github.io

color_scheme: dark

nav_enabled: true
search_enabled: true

nav_sort: case_sensitive

callouts:
  warning:
    title: Warning
    color: yellow
  hint:
    title: Hint
    color: yellow

collections:
  features:
    output: true

just_the_docs:
  collections:
    features:
      name: Features
      nav_fold: true

# Include iOS 7 Cydia / APT repository files (prevents Jekyll from dropping extensionless files)
include:
  - repo/Release
  - repo/Packages
  - repo/Packages.gz
  - repo/Packages.bz2
  - repo/Packages.xz
  - repo/CydiaIcon.png
  - repo/isrgrootx1.mobileconfig
  - repo/isrgrootx1.pem
  - repo/isrgrootx1.crt
  - repo/debs
