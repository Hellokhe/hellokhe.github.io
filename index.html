<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maxesd terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: black;
    color: #00ff88;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
}

/* terminal */
#terminal {
    padding: 20px;
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.4;
    transition: opacity 1.5s ease;
}

/* hidden state */
.fade-out {
    opacity: 0;
}

/* center reveal screen */
#main {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
}

/* reveal active */
#main.show {
    opacity: 1;
}

/* big text */
.glitch {
    font-size: 2rem;
    color: #00ff88;
    position: relative;
    text-shadow:
        0 0 5px #00ff88,
        0 0 10px #00ff88,
        0 0 20px #00ff88;
}

/* glitch layers */
.glitch::before,
.glitch::after {
    content: "hello my name is maxesd";
    position: absolute;
    left: 0;
    width: 100%;
}

.glitch::before {
    color: #ff00ff;
    animation: glitchTop 1.5s infinite;
}

.glitch::after {
    color: #00ffff;
    animation: glitchBottom 1.5s infinite;
}

/* subtitle */
.sub {
    margin-top: 15px;
    font-size: 1rem;
    color: #00ffaa;
    opacity: 0.8;
}

/* animations */
@keyframes glitchTop {
    0% { transform: translate(-2px, -2px); }
    50% { transform: translate(2px, 2px); }
    100% { transform: translate(-2px, -2px); }
}

@keyframes glitchBottom {
    0% { transform: translate(2px, 2px); }
    50% { transform: translate(-2px, -2px); }
    100% { transform: translate(2px, 2px); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="main">
    <div class="glitch">hello my name is maxesd</div>
    <div class="sub">I do cool tech stuff</div>
</div>

<script>
const terminal = document.getElementById("terminal");
const main = document.getElementById("main");

const bootLines = [
"[    0.0001] Booting maxOS kernel...",
"[    0.0420] Initializing hardware...",
"[    0.1337] Loading drivers...",
"[    0.2567] Mounting file systems...",
"[    0.4200] Starting network manager...",
"[    0.6666] Connecting to secure node...",
"[    0.7777] Authenticating...",
"[    0.8888] Access granted.",
"[    1.0000] Launching interface...",
"",
"maxOS v1.0.0",
"--------------------------",
""
];

let i = 0;

function typeLine(line, callback) {
    let j = 0;
    let lineEl = document.createElement("div");
    terminal.appendChild(lineEl);

    function typeChar() {
        if (j < line.length) {
            lineEl.textContent += line[j];
            j++;
            setTimeout(typeChar, 10);
        } else {
            terminal.appendChild(document.createElement("br"));
            callback();
        }
    }

    typeChar();
}

function runBoot() {
    if (i < bootLines.length) {
        typeLine(bootLines[i], () => {
            i++;
            setTimeout(runBoot, 80);
        });
    } else {
        // pause then fade out
        setTimeout(() => {
            terminal.classList.add("fade-out");

            // after fade, show main text
            setTimeout(() => {
                main.classList.add("show");
            }, 1500);

        }, 800);
    }
}

runBoot();
</script>

</body>
</html>
