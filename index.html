<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maxesd terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        background: black;
        color: #00ff88;
        font-family: 'Share Tech Mono', monospace;
        overflow: hidden;
    }

    #terminal {
        padding: 20px;
        white-space: pre-wrap;
        font-size: 16px;
        line-height: 1.4;
    }

    .cursor {
        display: inline-block;
        width: 10px;
        background: #00ff88;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0%, 50%, 100% { opacity: 1; }
        25%, 75% { opacity: 0; }
    }
</style>
</head>

<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

const bootLines = [
"[    0.0001] Booting maxOS kernel...",
"[    0.0420] Initializing hardware...",
"[    0.1337] Loading drivers...",
"[    0.2567] Mounting file systems...",
"[    0.4200] Starting network manager...",
"[    0.6666] Connecting to secure node...",
"[    0.7777] Authenticating...",
"[    0.8888] Access granted.",
"[    1.0000] Launching interface...",
"",
"maxOS v1.0.0",
"--------------------------",
""
];

let i = 0;

function typeLine(line, callback) {
    let j = 0;
    let currentLine = document.createElement("div");
    terminal.appendChild(currentLine);

    function typeChar() {
        if (j < line.length) {
            currentLine.textContent += line[j];
            j++;
            setTimeout(typeChar, 10);
        } else {
            terminal.appendChild(document.createElement("br"));
            callback();
        }
    }

    typeChar();
}

function runBootSequence() {
    if (i < bootLines.length) {
        typeLine(bootLines[i], () => {
            i++;
            setTimeout(runBootSequence, 100);
        });
    } else {
        setTimeout(startMainText, 500);
    }
}

function startMainText() {
    const message = "hello my name is maxesd\nI do cool tech stuff";
    let index = 0;

    let line = document.createElement("div");
    terminal.appendChild(line);

    function typeMessage() {
        if (index < message.length) {
            line.textContent += message[index];
            index++;
            setTimeout(typeMessage, 30);
        } else {
            addCursor();
        }
    }

    typeMessage();
}

function addCursor() {
    const cursor = document.createElement("span");
    cursor.classList.add("cursor");
    terminal.appendChild(cursor);
}

runBootSequence();
</script>

</body>
</html>
