<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max's Repository</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-weight: bold;
            transition: 0.2s ease;
        }
        a:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Max's Repository</h1>
        <p>Add this repo to your favorite package manager! :D</p>
        <div class="buttons">
            <!-- Replace https://hellokhe.github.io/ with your actual repo URL -->
            <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://hellokhe.github.io/">Add to Cydia (Old stuff)</a>
            <a href="sileo://source/https://hellokhe.github.io/">Add to Sileo</a>
            <a href="zbra://sources/add/https://hellokhe.github.io/">Add to Zebra</a>
        </div>
    </div>
</body>
</html>
