<h1>ZenOS</h1>

<p><b>ZenOS</b> is a real bare-metal operating system with a graphical user interface.</p>

<p>It boots directly on x86-64 hardware or in QEMU and gives you a simple desktop environment with windows, a taskbar, and input support.</p>

<p><b>No Linux. No host OS. Just your kernel running everything.</b></p>
