<h1>Features</h1>

<ul>
  <li><b>Bootloader</b> – Uses Limine, runs as a 64-bit kernel</li>
  <li><b>Graphical Desktop</b> – Framebuffer GUI with windows and taskbar</li>
  <li><b>Input Support</b> – PS2 keyboard and mouse</li>
  <li><b>Terminal</b> – Interactive command input inside a window</li>
</ul>
